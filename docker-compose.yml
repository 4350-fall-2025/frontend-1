# Partially built with Github copilot running Claude 4.5

services:
    backend:
        image: ghcr.io/4350-fall-2025/backend:latest
        ports:
            - "3000:3000"
        volumes:
            - ./firebase-prod.json:/app/credentials/firebase-prod.json:ro
        env_file:
            - ./.env
        restart: no
    frontend:
        image: ghcr.io/4350-fall-2025/frontend-1:latest
        ports:
            - "3001:3001"
        env_file:
            - ./.env
        depends_on:
            - backend
        restart: no
