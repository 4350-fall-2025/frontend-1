name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GCP_API_KEY=${{ vars.NEXT_PUBLIC_GCP_API_KEY }}
            NEXT_PUBLIC_GCP_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_GCP_AUTH_DOMAIN }}
            NEXT_PUBLIC_GCP_PROJECT_ID=${{ vars.NEXT_PUBLIC_GCP_PROJECT_ID }}
            NEXT_PUBLIC_GCP_BUCKET=${{ vars.NEXT_PUBLIC_GCP_BUCKET }}
            NEXT_PUBLIC_USE_EMULATOR=${{ vars.NEXT_PUBLIC_USE_EMULATOR }}
            NEXT_PUBLIC_USE_STORAGE=${{ vars.NEXT_PUBLIC_USE_STORAGE }}